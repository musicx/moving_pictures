<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sky"></div>

  <header>
    <h1>✨ Magic Frame ✨</h1>
    <p id="subtitle">Put your picture in and watch it come alive!</p>
  </header>

  <main>
    <div id="frame" class="frame">
      <div id="home" class="stage">
        <div class="drop-hint">🎨<br>Drop a photo of your picture here</div>
        <div class="buttons">
          <button id="btn-camera" class="magic-btn">📷 Take a photo</button>
          <button id="btn-file" class="magic-btn">🖼️ Choose a photo</button>
        </div>
        <input id="file" type="file" accept="image/*,.heic,.heif" hidden>
      </div>

      <div id="camera" class="stage" hidden>
        <video id="video" autoplay playsinline muted></video>
        <div class="buttons">
          <button id="btn-snap" class="magic-btn big">📸 Snap!</button>
          <button id="btn-cancel-camera" class="magic-btn small">Back</button>
        </div>
      </div>

      <div id="show" class="stage" hidden>
        <div id="canvas-box">
          <img id="photo" alt="">
          <canvas id="gl"></canvas>
          <canvas id="joints-layer"></canvas>
          <canvas id="sparkles"></canvas>
          <div id="scanbar"></div>
        </div>
      </div>
    </div>

    <p id="message"></p>

    <div id="controls" hidden>
      <div id="motions" class="buttons"></div>
      <div class="buttons">
        <button id="btn-gif" class="magic-btn">💾 Take the magic home</button>
        <button id="btn-grok" class="magic-btn" title="Save the picture and copy a prompt for Grok Imagine">🎬 Make a Grok video</button>
        <button id="btn-again" class="magic-btn small">🔄 Another one</button>
        <button id="btn-edit" class="magic-btn small" title="For grown-ups: drag the joints to fix the skeleton">🔧 Fix joints</button>
      </div>
      <div id="grok-help" hidden>
        <ol>
          <li>The picture was saved to your downloads.</li>
          <li>In Grok Imagine, upload that picture and choose video.</li>
          <li>Paste the prompt (it's already copied) and generate.</li>
        </ol>
        <textarea id="grok-prompt" readonly rows="4"></textarea>
        <div class="buttons">
          <button id="btn-copy-prompt" class="magic-btn small">📋 Copy prompt</button>
          <a class="magic-btn small" href="https://grok.com/imagine" target="_blank" rel="noopener">🚀 Open Grok</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
